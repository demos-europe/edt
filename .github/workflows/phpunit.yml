name: Tests (PHP)

on:
  push:
    branches:
      - 'main'
  pull_request:
    paths:
      - '**.php'
      - 'phpunit.xml'

jobs:
  phpunit:
    name: PHPUnit @ PHP ${{ matrix.php }} / ORM ${{ matrix.orm }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1']
        orm: ['^2.5', '^3.0']

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin doctrine/orm to ${{ matrix.orm }}
        run: composer require --no-update "doctrine/orm:${{ matrix.orm }}"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: ./bin/phpunit
